<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sector Forge</title>
  <desc id="desc">A red star inside a cyan orbital hexagon on a deep navy background.</desc>
  <defs>
